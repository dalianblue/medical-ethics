<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2c5f8a">
<title>随便聊聊 · 医学研究伦理申请助手</title>
<link rel="stylesheet" href="assets/style.css?v=4">
</head>
<body class="chat-body">
<header class="topbar chat-topbar">
  <a class="back-home" href="index.html">← 首页</a>
  <h1>随便聊聊</h1>
  <span class="stage-chip" id="stage-chip">阶段：了解想法</span>
</header>

<main class="chat-main">
  <div class="chat-history" id="chat-history"></div>
</main>

  <div class="chat-input-wrap">
  <div class="gen-bar" id="gen-bar" hidden>
    <button id="btn-gen" class="btn-primary gen-btn">📄 生成文书（方案+知情同意书）</button>
    <p class="gen-hint">根据以上对话内容生成，下载为 Markdown 文件</p>
  </div>
  <div class="chat-input-row">
    <textarea id="chat-input" rows="2" placeholder="用大白话描述你的研究想法，或粘贴已有方案…"></textarea>
    <button id="btn-chat-send" class="btn-primary">发送</button>
  </div>
  <p class="chat-note">AI 生成内容须经研究者核实，并经伦理委员会审查批准。对话仅在本浏览器与 DeepSeek 接口间传输。</p>
</div>

<script src="assets/marked.min.js"></script>
<script src="assets/risk_kb.js"></script>
<script src="assets/chat.js?v=14"></script>
</body>
</html>
